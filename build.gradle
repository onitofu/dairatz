plugins {
    id 'base'
}

group = project.maven_group
version = project.mod_version

tasks.register('verifyCommonIsolation') {
    group = 'verification'
    description = 'Fails if loader-specific APIs leak into the common source set.'

    def commonSources = fileTree('common') {
        include '**/*.java'
    }
    inputs.files(commonSources)

    doLast {
        def forbiddenPackages = [
                'net.fabricmc.',
                'net.minecraftforge.',
                'net.neoforged.'
        ]
        def violations = []
        commonSources.each { source ->
            def text = source.getText('UTF-8')
            forbiddenPackages.each { forbidden ->
                if (text.contains(forbidden)) {
                    violations.add("${relativePath(source)} contains ${forbidden}")
                }
            }
        }
        if (!violations.isEmpty()) {
            throw new GradleException(
                    "Loader APIs found in common sources:\n${violations.join('\n')}")
        }
    }
}

def supportedTargets = [
        '1.21.11-fabric'  : ':fabric',
        '1.21.11-forge'   : ':forge',
        '1.21.11-neoforge': ':neoforge'
]

tasks.register('buildTarget') {
    group = 'build'
    description = 'Builds and stages one loader target selected with -Ptarget=<minecraft>-<loader>.'

    def target = providers.gradleProperty('target')
    doFirst {
        if (!target.isPresent() || !supportedTargets.containsKey(target.get())) {
            throw new GradleException(
                    "Unsupported or missing target. Use one of: ${supportedTargets.keySet().join(', ')}")
        }
    }

    supportedTargets.each { targetName, projectPath ->
        def targetProject = findProject(projectPath)
        if (targetProject != null) {
            dependsOn(provider {
                target.isPresent() && target.get() == targetName
                        ? targetProject.tasks.named('stageArtifact').get()
                        : []
            })
        }
    }
}

tasks.register('buildAll') {
    group = 'build'
    description = 'Builds and stages all supported loader targets.'
    dependsOn subprojects.collect { it.tasks.named('stageArtifact') }
}

tasks.named('build') {
    dependsOn tasks.named('buildAll')
}
